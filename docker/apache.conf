<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    RedirectMatch ^/$ /FantasyRealm/Frontend/Html/index.html
    RedirectMatch ^/FantasyRealm/?$ /FantasyRealm/Frontend/Html/index.html

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/FantasyRealm/Frontend>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/FantasyRealm/Backend/api>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog ${APACHE_LOG_DIR}/fantasyrealm-error.log
    CustomLog ${APACHE_LOG_DIR}/fantasyrealm-access.log combined
</VirtualHost>
