<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | FantasyRealm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../Css/contact.css">

    <script src="../js/contact.js" defer></script>
</head>

<body>

<header class="contact-navbar">

    <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span>FantasyRealm</span>
    </a>

    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="character-gallery.html">
            Characters
        </a>

        <a href="create-character.html">
            Create
        </a>

        <a
            id="login-link"
            href="login.html"
        >
            Login
        </a>

        <a
            id="register-link"
            class="nav-register"
            href="register.html"
        >
            Register
        </a>

        <span
            id="nav-username"
            class="nav-username"
            hidden
        ></span>

        <a
            id="logout-link"
            href="#"
            hidden
        >
            Logout
        </a>

    </nav>

</header>


<main class="contact-page">

    <section class="contact-panel">

        <p class="section-label">
            CONTACT
        </p>

        <h1>
            Contact FantasyRealm
        </h1>

        <p class="contact-intro">
            Have a question or need help? Send us a message.
        </p>


        <p
            id="form-message"
            class="form-message"
            hidden
        ></p>


        <form
            id="contact-form"
            class="contact-form"
        >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                maxlength="50"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                maxlength="255"
                required
            >


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                rows="6"
                maxlength="2000"
                required
            ></textarea>


            <button
                id="send-button"
                type="submit"
            >
                Send Message
            </button>

        </form>


        <div class="contact-actions">

            <a
                href="index.html"
                class="back-link"
            >
                Back to Home
            </a>

            <a
                href="character-gallery.html"
                class="back-link"
            >
                View Characters
            </a>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-brand">
        ✦ FantasyRealm
    </div>

    <p>
        © 2026 FantasyRealm. All rights reserved.
    </p>

    <div class="footer-links">

        <a href="#">
            Legal Notice
        </a>

        <a href="#">
            Terms
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</footer>

</body>
</html>
