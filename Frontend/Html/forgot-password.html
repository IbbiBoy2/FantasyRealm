<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | FantasyRealm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../Css/forgot-password.css">

    <script src="../js/forgot-password.js" defer></script>
</head>

<body>

<header class="forgot-navbar">

    <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span>FantasyRealm</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="character-gallery.html">Characters</a>
        <a href="login.html">Login</a>
        <a class="nav-register" href="register.html">Register</a>
    </nav>

</header>

<main class="forgot-page">

    <section class="forgot-panel">

        <p class="section-label">ACCOUNT RECOVERY</p>

        <h1>Forgot Password?</h1>

        <p class="forgot-intro">
            Enter your email address and we will create a secure password reset link.
        </p>

        <p
            id="form-message"
            class="form-message"
            hidden
        ></p>

        <p
            id="dev-reset-link"
            class="dev-reset-link"
            hidden
        >
            Development reset link:
            <a id="reset-link" href="#">
                Reset Password
            </a>
        </p>

        <form id="forgot-form" class="forgot-form">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <button type="submit" id="forgot-button">
                Send Reset Link
            </button>

        </form>

        <p class="login-link">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

    </section>

</main>

</body>
</html>
