<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FantasyRealm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../Css/reset-password.css">

    <script src="../js/reset-password.js" defer></script>
</head>

<body>

<header class="reset-navbar">

    <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span>FantasyRealm</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="character-gallery.html">Characters</a>
        <a href="login.html">Login</a>
        <a class="nav-register" href="register.html">Register</a>
    </nav>

</header>

<main class="reset-page">

    <section class="reset-panel">

        <p class="section-label">ACCOUNT RECOVERY</p>

        <h1>Reset Password</h1>

        <p class="reset-intro">
            Choose a new password for your FantasyRealm account.
        </p>

        <p
            id="form-message"
            class="form-message"
            hidden
        ></p>

        <form id="reset-form" class="reset-form">

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
            >

            <label for="password-confirm">
                Confirm New Password
            </label>

            <input
                type="password"
                id="password-confirm"
                name="password_confirm"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="reset-button">
                Reset Password
            </button>

        </form>

        <p class="login-link">
            <a href="login.html">Back to Login</a>
        </p>

    </section>

</main>

</body>
</html>
