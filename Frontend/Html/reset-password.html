<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | FantasyRealm</title>

    <meta
      name="description"
      content="Choose a new password for your FantasyRealm account."
    />

    <!-- Shared application typography. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- FantasyRealm favicon. -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />

    <!-- Page-specific and shared stylesheets. -->
    <link rel="stylesheet" href="../Css/reset-password.css" />
    <link rel="stylesheet" href="../Css/header.css" />
    <link rel="stylesheet" href="../Css/footer.css" />
    <link rel="stylesheet" href="../Css/accessibility.css" />
    <link rel="stylesheet" href="../Css/layout.css" />

    <!-- Shared components and password reset controller. -->
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script src="../js/reset-password.js" defer></script>
  </head>

  <body class="app-layout" data-page="reset-password">
    <!-- Allow keyboard users to skip the navigation. -->
    <a class="skip-link" href="#main-content"> Skip to main content </a>

    <!-- Shared application header. -->
    <header id="site-header" class="app-header"></header>

    <!-- Password reset content. -->
    <main id="main-content" class="app-main reset-page" tabindex="-1">
      <section class="reset-panel" aria-labelledby="reset-heading">
        <!-- Page introduction. -->
        <div class="reset-introduction">
          <p class="section-label">ACCOUNT RECOVERY</p>

          <h1 id="reset-heading">Create a New Password</h1>

          <p class="reset-intro">
            Your adventure continues here. Choose a new password to regain
            access to your FantasyRealm account.
          </p>

          <div class="reset-divider" aria-hidden="true">
            <span></span>
            <span>✦</span>
            <span></span>
          </div>
        </div>

        <!--
          PASSWORD RESET FORM

          The reset token is read from the URL by reset-password.js.
          The backend validates the token and updates the password.
        -->
        <form id="reset-form" class="reset-form" method="post">
          <div class="form-field">
            <label for="password">New password</label>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Enter your new password"
              minlength="12"
              required
            />
          </div>

          <div class="form-field">
            <label for="password-confirm"> Confirm new password </label>

            <input
              id="password-confirm"
              name="password_confirm"
              type="password"
              autocomplete="new-password"
              placeholder="Confirm your new password"
              minlength="12"
              required
            />
          </div>

          <!-- Accessible feedback for reset results and errors. -->
          <p
            id="form-message"
            class="form-message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            hidden
          ></p>

          <button id="reset-button" class="reset-button" type="submit">
            Reset Password
          </button>
        </form>

        <p class="recovery-information">
          For security reasons, your password reset link expires after one hour
          and can only be used once.
        </p>

        <div class="forgot-actions">
          <a class="back-link" href="login.html">
            <span aria-hidden="true">←</span>
            Back to Login
          </a>
        </div>
      </section>
    </main>

    <!-- Shared application footer. -->
    <footer id="site-footer" class="app-footer"></footer>
  </body>
</html>
