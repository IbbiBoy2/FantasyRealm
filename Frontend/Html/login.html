<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FantasyRealm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/login.css">

    <script src="../js/login.js" defer></script>
</head>

<body>

<header class="login-navbar">

    <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span>FantasyRealm</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="character-gallery.html">Characters</a>
        <a class="active" href="login.html">Login</a>
        <a class="nav-register" href="register.html">Register</a>
    </nav>

</header>

<main class="login-page">

    <section class="login-panel">

        <p class="section-label">WELCOME BACK</p>

        <h1>Login</h1>

        <p class="login-intro">
            Enter your account details to continue your journey.
        </p>

        <p
            id="form-message"
            class="form-message"
            hidden
        ></p>

        <form id="login-form" class="login-form">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="login-button">
                Login
            </button>

        </form>

        <p class="forgot-link">
            <a href="forgot-password.html">
                Forgot your password?
            </a>
        </p>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </section>

</main>

</body>
</html>
