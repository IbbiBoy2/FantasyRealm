<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FantasyRealm">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29154a"/>
      <stop offset="100%" stop-color="#080513"/>
    </linearGradient>

    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1c9"/>
      <stop offset="100%" stop-color="#d7a85f"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark-fantasy background. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#background)" stroke="#9870c9" stroke-width="2" />

  <!-- Main magical star. -->
  <path d="M32 10
           L38 26
           L54 32
           L38 38
           L32 54
           L26 38
           L10 32
           L26 26 Z" fill="url(#star)" />
</svg>
